services:

  # =========================
  # API GATEWAY
  # =========================
  api-gateway:
    build:
      context: ../../ApiGateway
      dockerfile: Dockerfile
    container_name: evnexus-api-gateway
    ports:
      - "5000:8080"
    depends_on:
      - authentication-service
      - map-service
      - payment-service
      - dashboard-service
    networks:
      - evnexus-network

  # =========================
  # AUTHENTICATION SERVICE
  # =========================
  authentication-service:
    build:
      context: ../../AuthenticationService/src/EVNexus.AuthService
      dockerfile: Dockerfile
    container_name: evnexus-auth-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=auth-db;Port=3306;Database=auth_db;User=evnexus;Password=evnexus_password;
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - evnexus-network

  # =========================
  # MAP SERVICE
  # =========================
  map-service:
    build:
      context: ../../MapService/src/EVNexus.MapService
      dockerfile: Dockerfile
    container_name: evnexus-map-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=map-db;Port=3306;Database=map_db;User=evnexus;Password=evnexus_password;
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      map-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - evnexus-network

  # =========================
  # PAYMENT SERVICE
  # =========================
  payment-service:
    build:
      context: ../../PaymentService/src/EVNexus.PaymentService
      dockerfile: Dockerfile
    container_name: evnexus-payment-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=payment-db;Port=3306;Database=payment_db;User=evnexus;Password=evnexus_password;
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - evnexus-network

  # =========================
  # DASHBOARD & ANALYTICS
  # =========================
  dashboard-service:
    build:
      context: ../../DashboardAnalyticsService/src/EVNexus.DashboardService
      dockerfile: Dockerfile
    container_name: evnexus-dashboard-service
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=dashboard-db;Port=3306;Database=dashboard_db;User=evnexus;Password=evnexus_password;
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      dashboard-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - evnexus-network

  # =========================
  # AUTH DATABASE
  # =========================
  auth-db:
    image: mysql:8.0
    container_name: evnexus-auth-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: evnexus
      MYSQL_PASSWORD: evnexus_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evnexus-network

  # =========================
  # MAP DATABASE
  # =========================
  map-db:
    image: mysql:8.0
    container_name: evnexus-map-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: map_db
      MYSQL_USER: evnexus
      MYSQL_PASSWORD: evnexus_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - map-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evnexus-network

  # =========================
  # PAYMENT DATABASE
  # =========================
  payment-db:
    image: mysql:8.0
    container_name: evnexus-payment-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: payment_db
      MYSQL_USER: evnexus
      MYSQL_PASSWORD: evnexus_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3309:3306"
    volumes:
      - payment-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evnexus-network

  # =========================
  # DASHBOARD DATABASE
  # =========================
  dashboard-db:
    image: mysql:8.0
    container_name: evnexus-dashboard-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dashboard_db
      MYSQL_USER: evnexus
      MYSQL_PASSWORD: evnexus_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3310:3306"
    volumes:
      - dashboard-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evnexus-network

  # =========================
  # APACHE KAFKA (EVENT BROKER)
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: evnexus-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - evnexus-network

# =========================
# VOLUMES
# =========================
volumes:
  auth-db-data:
  map-db-data:
  payment-db-data:
  dashboard-db-data:
  kafka-data:

# =========================
# NETWORK
# =========================
networks:
  evnexus-network:
    driver: bridge