services:

  # =========================
  # API GATEWAY
  # =========================
  api-gateway:
    build:
      context: ../../ApiGateway
      dockerfile: Dockerfile
    container_name: evnexus-api-gateway
    ports:
      - "5000:8080"
    depends_on:
      - authentication-service
      - map-service
      - payment-service
      - dashboard-service
    networks:
      - evnexus-network

  # =========================
  # AUTHENTICATION SERVICE
  # =========================
  authentication-service:
    build:
      context: ../../AuthenticationService/src/EVNexus.AuthService
      dockerfile: Dockerfile
    container_name: evnexus-auth-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Server=auth-db;Port=3306;Database=${AUTH_DB_NAME:-evnexus_auth};User=${MYSQL_USER:-evnexus};Password=${AUTH_DB_PASSWORD:-evnexus_password};
      - JWT_SECRET=${JWT_SECRET}
      - Jwt__Key=${JWT_SECRET}
      - Jwt__SecretKey=${JWT_SECRET}
      - EmailSettings__SmtpHost=${SMTP_HOST:-smtp.gmail.com}
      - EmailSettings__SmtpPort=${SMTP_PORT:-587}
      - EmailSettings__SenderEmail=${SMTP_FROM_EMAIL:-}
      - EmailSettings__SenderName=${SMTP_FROM_NAME:-EVNexus}
      - EmailSettings__SenderPassword=${SMTP_PASSWORD:-}
      - EmailSettings__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - evnexus-network

  # =========================
  # MAP SERVICE
  # =========================
  map-service:
    build:
      context: ../../MapService/src/EVNexus.MapService
      dockerfile: Dockerfile
    container_name: evnexus-map-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Server=map-db;Port=3306;Database=${MAP_DB_NAME:-evnexus_map};User=${MYSQL_USER:-evnexus};Password=${MAP_DB_PASSWORD:-evnexus_password};
      - JWT_SECRET=${JWT_SECRET}
      - Jwt__Key=${JWT_SECRET}
      - Jwt__SecretKey=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      map-db:
        condition: service_healthy
    networks:
      - evnexus-network

  # =========================
  # PAYMENT SERVICE
  # =========================
  payment-service:
    build:
      context: ../../PaymentService/src/EVNexus.PaymentService
      dockerfile: Dockerfile
    container_name: evnexus-payment-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Server=payment-db;Port=3306;Database=${PAYMENT_DB_NAME:-evnexus_payment};User=${MYSQL_USER:-evnexus};Password=${PAYMENT_DB_PASSWORD:-evnexus_password};
      - JWT_SECRET=${JWT_SECRET}
      - Jwt__Key=${JWT_SECRET}
      - Jwt__SecretKey=${JWT_SECRET}
      - Kafka__BootstrapServers=${KAFKA_BOOTSTRAP_SERVERS:-evnexus-kafka:9092}
      - Kafka__Topics__ChargingSessionCompleted=${KAFKA_TOPIC_CHARGING_SESSION_COMPLETED:-ChargingSessionCompleted}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - evnexus-network

  # =========================
  # DASHBOARD & ANALYTICS
  # =========================
  dashboard-service:
    build:
      context: ../../DashboardAnalyticsService/src/EVNexus.DashboardService
      dockerfile: Dockerfile
    container_name: evnexus-dashboard-service
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Server=dashboard-db;Port=3306;Database=${DASHBOARD_DB_NAME:-evnexus_dashboard};User=${MYSQL_USER:-evnexus};Password=${DASHBOARD_DB_PASSWORD:-evnexus_password};
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      dashboard-db:
        condition: service_healthy
    networks:
      - evnexus-network

  # =========================
  # AUTH DATABASE
  # =========================
  auth-db:
    image: mysql:8.0
    container_name: evnexus-auth-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${AUTH_DB_NAME:-evnexus_auth}
      MYSQL_USER: ${MYSQL_USER:-evnexus}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-evnexus_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3307:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evnexus-network

  # =========================
  # MAP DATABASE
  # =========================
  map-db:
    image: mysql:8.0
    container_name: evnexus-map-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MAP_DB_NAME:-evnexus_map}
      MYSQL_USER: ${MYSQL_USER:-evnexus}
      MYSQL_PASSWORD: ${MAP_DB_PASSWORD:-evnexus_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3308:3306"
    volumes:
      - map-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evnexus-network

  # =========================
  # PAYMENT DATABASE
  # =========================
  payment-db:
    image: mysql:8.0
    container_name: evnexus-payment-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${PAYMENT_DB_NAME:-evnexus_payment}
      MYSQL_USER: ${MYSQL_USER:-evnexus}
      MYSQL_PASSWORD: ${PAYMENT_DB_PASSWORD:-evnexus_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3309:3306"
    volumes:
      - payment-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evnexus-network

  # =========================
  # DASHBOARD DATABASE
  # =========================
  dashboard-db:
    image: mysql:8.0
    container_name: evnexus-dashboard-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DASHBOARD_DB_NAME:-evnexus_dashboard}
      MYSQL_USER: ${MYSQL_USER:-evnexus}
      MYSQL_PASSWORD: ${DASHBOARD_DB_PASSWORD:-evnexus_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3310:3306"
    volumes:
      - dashboard-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evnexus-network

# =========================
# VOLUMES
# =========================
volumes:
  auth-db-data:
  map-db-data:
  payment-db-data:
  dashboard-db-data:

# =========================
# NETWORK
# =========================
networks:
  evnexus-network:
    driver: bridge