# Standalone: do not merge with docker-compose.yml (ports/names would be retained).
name: evnexus-e2e-playwright

x-app: &app
  environment: &app-env
    ASPNETCORE_ENVIRONMENT: Development
    JWT_SECRET: ${E2E_JWT_SECRET:?Run e2e-local.mjs init}
    Jwt__Key: ${E2E_JWT_SECRET}
    Jwt__SecretKey: ${E2E_JWT_SECRET}
    INTERNAL_API_KEY: ${E2E_INTERNAL_KEY}
    Kafka__BootstrapServers: kafka:9092
    Kafka__Topics__ChargingSessionCompleted: charging-session-completed
    Kafka__Topics__PaymentCompleted: payment-completed
  networks: [isolated]

x-db: &db
  image: mysql:8.0
  networks: [isolated]
  healthcheck:
    test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent']
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 30s

services:
  api-gateway:
    build: ../../ApiGateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports: ['127.0.0.1:15000:8080']
    networks: [isolated]
    depends_on: [authentication-service, map-service, payment-service, dashboard-service]

  authentication-service:
    <<: *app
    build: ../../AuthenticationService/src/EVNexus.AuthService
    ports: ['127.0.0.1:15001:8080']
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Server=auth-db;Port=3306;Database=evnexus_auth_e2e;User=evnexus_e2e;Password=${E2E_DB_PASSWORD};
      EmailSettings__SmtpHost: mailpit
      EmailSettings__SmtpPort: '1025'
      EmailSettings__SenderEmail: evnexus@e2e.invalid
      EmailSettings__SenderName: EVNexus isolated E2E
      EmailSettings__SenderPassword: ${E2E_SMTP_PASSWORD}
      EmailSettings__EnableSsl: 'false'
      EmailSettings__FrontendBaseUrl: http://127.0.0.1:3100
    depends_on:
      auth-db: {condition: service_healthy}
      mailpit: {condition: service_healthy}

  map-service:
    <<: *app
    build: ../../MapService/src/EVNexus.MapService
    ports: ['127.0.0.1:15002:8080']
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Server=map-db;Port=3306;Database=evnexus_map_e2e;User=evnexus_e2e;Password=${E2E_DB_PASSWORD};
    depends_on:
      map-db: {condition: service_healthy}
      kafka: {condition: service_healthy}

  payment-service:
    <<: *app
    build: ../../PaymentService/src/EVNexus.PaymentService
    ports: ['127.0.0.1:15003:8080']
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Server=payment-db;Port=3306;Database=evnexus_payment_e2e;User=evnexus_e2e;Password=${E2E_DB_PASSWORD};
    depends_on:
      payment-db: {condition: service_healthy}
      kafka: {condition: service_healthy}

  dashboard-service:
    <<: *app
    build: ../../DashboardAnalyticsService/src/EVNexus.DashboardService
    ports: ['127.0.0.1:15004:8080']
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: Server=dashboard-db;Port=3306;Database=evnexus_dashboard_e2e;User=evnexus_e2e;Password=${E2E_DB_PASSWORD};
    depends_on:
      dashboard-db: {condition: service_healthy}
      kafka: {condition: service_healthy}

  auth-db:
    <<: *db
    environment: {MYSQL_DATABASE: evnexus_auth_e2e, MYSQL_USER: evnexus_e2e, MYSQL_PASSWORD: '${E2E_DB_PASSWORD}', MYSQL_ROOT_PASSWORD: '${E2E_DB_ROOT_PASSWORD}'}
    volumes: [auth-data:/var/lib/mysql]
  map-db:
    <<: *db
    environment: {MYSQL_DATABASE: evnexus_map_e2e, MYSQL_USER: evnexus_e2e, MYSQL_PASSWORD: '${E2E_DB_PASSWORD}', MYSQL_ROOT_PASSWORD: '${E2E_DB_ROOT_PASSWORD}'}
    volumes: [map-data:/var/lib/mysql]
  payment-db:
    <<: *db
    environment: {MYSQL_DATABASE: evnexus_payment_e2e, MYSQL_USER: evnexus_e2e, MYSQL_PASSWORD: '${E2E_DB_PASSWORD}', MYSQL_ROOT_PASSWORD: '${E2E_DB_ROOT_PASSWORD}'}
    volumes: [payment-data:/var/lib/mysql]
  dashboard-db:
    <<: *db
    environment: {MYSQL_DATABASE: evnexus_dashboard_e2e, MYSQL_USER: evnexus_e2e, MYSQL_PASSWORD: '${E2E_DB_PASSWORD}', MYSQL_ROOT_PASSWORD: '${E2E_DB_ROOT_PASSWORD}'}
    volumes: [dashboard-data:/var/lib/mysql]

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    networks: [isolated]
    environment:
      KAFKA_CFG_NODE_ID: '1'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    volumes: [kafka-data:/bitnami/kafka]
    healthcheck:
      test: [CMD-SHELL, 'kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27.4
    networks: [isolated]
    ports: ['127.0.0.1:18025:8025']
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_DATABASE: /data/mailpit.db
    volumes: [mail-data:/data]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  isolated:
    driver: bridge
volumes:
  auth-data:
  map-data:
  payment-data:
  dashboard-data:
  kafka-data:
  mail-data:
