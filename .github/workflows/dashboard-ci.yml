name: Dashboard & AI Analytics Service CI (Sprint 4)

on:
  pull_request:
    branches:
      - main
      - develop
      - 'Payment-Service'
    paths:
      - 'DashboardAnalyticsService/**'
      - 'PaymentService/**'
      - 'docs/**'
      - '.github/workflows/dashboard-ci.yml'

  push:
    branches:
      - main
      - develop
      - 'Payment-Service'
    paths:
      - 'DashboardAnalyticsService/**'
      - 'PaymentService/**'
      - 'docs/**'
      - '.github/workflows/dashboard-ci.yml'

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Unit Tests, Integration Tests & Postman API Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: evnexus_dashboard_test
          MYSQL_USER: evnexus
          MYSQL_PASSWORD: evnexus_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=evnexus_dashboard_test;User=evnexus;Password=evnexus_password;"
      Jwt__Key: "EVNexus_SuperSecret_JwtAuthentication_Key_2026_Enterprise_Secure!"
      Jwt__Issuer: "EVNexus.AuthService"
      Jwt__Audience: "EVNexus.Microservices"

    steps:
      # -----------------------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. SETUP RUNTIMES (.NET 8 and Node.js for Newman)
      # -----------------------------------------------------------------------
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js for Newman (Postman CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and HTML Reporter
        run: npm install -g newman newman-reporter-htmlextra wait-on

      # -----------------------------------------------------------------------
      # 3. RESTORE & BUILD SERVICES (Build Verification Stage)
      # -----------------------------------------------------------------------
      - name: Restore Dashboard & Analytics Service
        run: dotnet restore DashboardAnalyticsService/src/EVNexus.DashboardService/EVNexus.DashboardService.csproj

      - name: Build Dashboard & Analytics Service
        run: dotnet build DashboardAnalyticsService/src/EVNexus.DashboardService/EVNexus.DashboardService.csproj --no-restore --configuration Release

      - name: Restore Test Projects
        run: |
          dotnet restore DashboardAnalyticsService/tests/EVNexus.DashboardService.Tests/EVNexus.DashboardService.Tests.csproj
          dotnet restore PaymentService/tests/EVNexus.PaymentService.Tests/EVNexus.PaymentService.Tests.csproj

      - name: Build Test Projects
        run: |
          dotnet build DashboardAnalyticsService/tests/EVNexus.DashboardService.Tests/EVNexus.DashboardService.Tests.csproj --no-restore --configuration Release
          dotnet build PaymentService/tests/EVNexus.PaymentService.Tests/EVNexus.PaymentService.Tests.csproj --no-restore --configuration Release

      # -----------------------------------------------------------------------
      # 4. RUN UNIT TESTS (>=70% Code Coverage Verification Stage)
      # -----------------------------------------------------------------------
      - name: Run Sprint 4 Dashboard Unit Tests & Collect Coverage
        run: >
          dotnet test DashboardAnalyticsService/tests/EVNexus.DashboardService.Tests/EVNexus.DashboardService.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage-dashboard

      # -----------------------------------------------------------------------
      # 5. RUN INTEGRATION TESTS (RBAC, Multi-tenancy & Endpoints Stage)
      # -----------------------------------------------------------------------
      - name: Run Sprint 4 API Integration Tests
        run: >
          dotnet test PaymentService/tests/EVNexus.PaymentService.Tests/EVNexus.PaymentService.Tests.csproj
          --filter "FullyQualifiedName~Sprint4|FullyQualifiedName~CompanyAnalytics"
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage-integration

      # -----------------------------------------------------------------------
      # 6. RUN POSTMAN AUTOMATED API SUITE VIA NEWMAN
      # -----------------------------------------------------------------------
      - name: Start Dashboard Service for Postman Verification
        run: |
          dotnet run --project PaymentService/src/EVNexus.PaymentService/EVNexus.PaymentService.csproj \
            --configuration Release \
            --no-build \
            --urls "http://127.0.0.1:5004" &
        env:
          ASPNETCORE_ENVIRONMENT: Testing

      - name: Wait for API Service to be reachable on Port 5004
        run: npx wait-on -t 30000 http://127.0.0.1:5004/swagger/v1/swagger.json || echo "Swagger ready"

      - name: Execute Postman Automated Collection (Newman)
        id: postman-tests
        run: |
          mkdir -p ./newman-reports
          newman run docs/Sprint4_Postman_Collection.json \
            --env-var baseUrl=http://127.0.0.1:5004 \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export ./newman-reports/dashboard-api-report.html \
            --bail

      # -----------------------------------------------------------------------
      # 7. UPLOAD REPORTS & ARTIFACTS FOR QA REVIEW
      # -----------------------------------------------------------------------
      - name: Upload Postman Newman Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-test-report
          path: ./newman-reports

      - name: Upload Code Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-reports
          path: |
            ./coverage-dashboard
            ./coverage-integration

      # -----------------------------------------------------------------------
      # 8. BUILD DOCKER IMAGE (Deployment Readiness Verification)
      # -----------------------------------------------------------------------
      - name: Build Dashboard & Analytics Docker Image
        run: docker build -t evnexus-dashboard-service:ci DashboardAnalyticsService/src/EVNexus.DashboardService
