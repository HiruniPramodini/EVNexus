name: Payment Service CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'PaymentService/**'
      - '.github/workflows/payment-ci.yml'

  push:
    branches:
      - main
      - develop
    paths:
      - 'PaymentService/**'
      - '.github/workflows/payment-ci.yml'

  workflow_dispatch:

jobs:
  build-test:
    name: Build, Test and Code Coverage Check
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: payment_db_test
          MYSQL_USER: evnexus
          MYSQL_PASSWORD: evnexus_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=payment_db_test;User=evnexus;Password=evnexus_password;"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Payment Service
        run: dotnet restore PaymentService/src/EVNexus.PaymentService/EVNexus.PaymentService.csproj

      - name: Build Payment Service
        run: dotnet build PaymentService/src/EVNexus.PaymentService/EVNexus.PaymentService.csproj --no-restore --configuration Release

      - name: Restore test project
        run: dotnet restore PaymentService/tests/EVNexus.PaymentService.Tests/EVNexus.PaymentService.Tests.csproj

      - name: Build test project
        run: dotnet build PaymentService/tests/EVNexus.PaymentService.Tests/EVNexus.PaymentService.Tests.csproj --no-restore --configuration Release

      - name: Run Payment Service Automated Tests & Collect Coverage
        run: >
          dotnet test PaymentService/tests/EVNexus.PaymentService.Tests/EVNexus.PaymentService.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload Code Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-code-coverage
          path: ./coverage

      - name: Build Payment Docker image
        run: docker build -t evnexus-payment-service:ci PaymentService/src/EVNexus.PaymentService
