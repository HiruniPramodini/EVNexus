name: Map Service CD

on:
  push:
    branches:
      - main
      - EVNexus_Ci_Cd_Pipeline
    paths:
      - 'MapService/**'
      - '.github/workflows/map-cd.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Test and Deploy Map Service
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: map_db_test
          MYSQL_USER: evnexus
          MYSQL_PASSWORD: evnexus_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=map_db_test;User=evnexus;Password=evnexus_password;"
      MAP_DB_PASSWORD: evnexus_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore MapService/src/EVNexus.MapService/EVNexus.MapService.csproj

      - name: Build Map Service
        run: dotnet build MapService/src/EVNexus.MapService/EVNexus.MapService.csproj --no-restore --configuration Release

      - name: Restore test project
        run: dotnet restore MapService/tests/EVNexus.MapService.Tests/EVNexus.MapService.Tests.csproj

      - name: Build test project
        run: dotnet build MapService/tests/EVNexus.MapService.Tests/EVNexus.MapService.Tests.csproj --no-restore --configuration Release

      - name: Run Map Service tests
        run: dotnet test MapService/tests/EVNexus.MapService.Tests/EVNexus.MapService.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Publish Map Service
        run: dotnet publish MapService/src/EVNexus.MapService/EVNexus.MapService.csproj --configuration Release --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'evnexus-map-service-prod'
          publish-profile: ${{ secrets.AZURE_MAP_PUBLISH_PROFILE }}
          package: ./publish