name: Map Service CD

on:
  push:
    branches:
      - main
    paths:
      - 'MapService/**'
      - '.github/workflows/map-cd.yml'

  workflow_dispatch:

jobs:
  build-publish:
    name: Build, Test and Package Map Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Map Service
        run: dotnet restore MapService/src/EVNexus.MapService/EVNexus.MapService.csproj

      - name: Build Map Service
        run: dotnet build MapService/src/EVNexus.MapService/EVNexus.MapService.csproj --no-restore --configuration Release

      - name: Restore test project
        run: dotnet restore MapService/tests/EVNexus.MapService.Tests/EVNexus.MapService.Tests.csproj

      - name: Build test project
        run: dotnet build MapService/tests/EVNexus.MapService.Tests/EVNexus.MapService.Tests.csproj --no-restore --configuration Release

      - name: Run Map Service tests
        run: dotnet test MapService/tests/EVNexus.MapService.Tests/EVNexus.MapService.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Publish Map Service
        run: dotnet publish MapService/src/EVNexus.MapService/EVNexus.MapService.csproj --configuration Release --output ./publish

      - name: Build Map Docker image
        run: docker build -t evnexus-map-service:cd MapService/src/EVNexus.MapService

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: evnexus-map-service
          path: ./publish