name: Deploy Azure Event Hubs (Kafka Broker)

on:
  push:
    branches:
      - feature/map-cicd-pipeline
    paths:
      - 'Infrastructure/azure/**'
      - '.github/workflows/deploy-eventhubs-kafka.yml'
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Azure Resource Group'
        required: true
        default: 'rg-evnexus-eastasia'
      namespace_name:
        description: 'Event Hubs Kafka Namespace'
        required: true
        default: 'evnexus-kafka-hub'
      location:
        description: 'Azure Region'
        required: true
        default: 'eastasia'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-kafka:
    name: Provision Azure Event Hubs for Kafka
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6F42B41A4BBD4A0B87545D2B9207B401 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A591A99199DA439F962C5A3AC58E2FBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_34EF6A9ADE2444C391FDB22D44A1AF8F }}

      - name: Deploy Azure Event Hubs Kafka Cluster (Bicep)
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_34EF6A9ADE2444C391FDB22D44A1AF8F }}
          resourceGroupName: ${{ github.event.inputs.resource_group || 'rg-evnexus-eastasia' }}
          template: ./Infrastructure/azure/eventhubs-kafka.bicep
          parameters: >-
            namespaceName=${{ github.event.inputs.namespace_name || 'evnexus-kafka-hub' }}
            location=${{ github.event.inputs.location || 'eastasia' }}
            skuTier=Standard
            partitionCount=3
            messageRetentionInDays=1

      - name: Summarize Kafka Connection Details
        run: |
          echo "=========================================================="
          echo "Azure Event Hubs Kafka deployment completed successfully!"
          echo "Bootstrap Server: ${{ github.event.inputs.namespace_name || 'evnexus-kafka-hub' }}.servicebus.windows.net:9093"
          echo "Active Topics:"
          echo "  - evnexus.charging.sessions"
          echo "  - evnexus.payment.events"
          echo "  - evnexus.map.stations"
          echo "=========================================================="
