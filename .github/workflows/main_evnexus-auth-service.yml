# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - evnexus-auth-service

on:
  push:
    branches:
      - main
    paths:
      - 'AuthenticationService/**'
      - '.github/workflows/main_evnexus-auth-service.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore Authentication Service
        run: dotnet restore AuthenticationService/src/EVNexus.AuthService/EVNexus.AuthService.csproj

      - name: Build Authentication Service
        run: dotnet build AuthenticationService/src/EVNexus.AuthService/EVNexus.AuthService.csproj --no-restore --configuration Release

      - name: Restore Authentication Service Tests
        run: dotnet restore AuthenticationService/tests/EVNexus.AuthService.Tests/EVNexus.AuthService.Tests.csproj

      - name: Build Authentication Service Tests
        run: dotnet build AuthenticationService/tests/EVNexus.AuthService.Tests/EVNexus.AuthService.Tests.csproj --no-restore --configuration Release

      - name: Run Authentication Service Tests
        run: dotnet test AuthenticationService/tests/EVNexus.AuthService.Tests/EVNexus.AuthService.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Publish Authentication Service
        run: dotnet publish AuthenticationService/src/EVNexus.AuthService/EVNexus.AuthService.csproj --configuration Release --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6F42B41A4BBD4A0B87545D2B9207B401 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A591A99199DA439F962C5A3AC58E2FBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_34EF6A9ADE2444C391FDB22D44A1AF8F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'evnexus-auth-service'
          slot-name: 'Production'
          package: .
