name: Frontend CD

on:
  push:
    branches:
      - main
      - EVNexus_Ci_Cd_Pipeline
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy Frontend to Azure App Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend

      - name: Build React Application
        run: npm run build
        working-directory: Frontend
        env:
          VITE_API_GATEWAY_URL: ""

      - name: Prepare Deployment Package
        run: |
          mkdir -p publish
          cp -r Frontend/dist publish/dist
          cp Frontend/server.js publish/server.js
          cp Frontend/package.json publish/package.json

      - name: Extract App Name from Publish Profile
        env:
          PROFILE: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
        run: |
          APP_NAME=$(node -e "
            const xml = process.env.PROFILE || '';
            const match = xml.match(/msdeploySite=[\"']([^\"']+)[\"']/i) || xml.match(/publishProfile\s+profileName=[\"']([^\"']+)[\"']/i);
            console.log(match ? match[1] : 'evnexus-frontend-prod');
          ")
          echo "Discovered App Name: $APP_NAME"
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: ./publish
