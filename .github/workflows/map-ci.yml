name: Map Service CI

on:
  pull_request:
    branches:
      - main
      - develop
      - feature/map-cicd-pipeline
    paths:
      - 'MapService/**'
      - '.github/workflows/map-ci.yml'

  push:
    branches:
      - main
      - develop
      - feature/map-cicd-pipeline
    paths:
      - 'MapService/**'
      - '.github/workflows/map-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Test and Docker Check
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_map_root_only_password
          MYSQL_DATABASE: map_db_test
          MYSQL_USER: evnexus_ci
          MYSQL_PASSWORD: ci_map_only_password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      MAP_TEST_CONNECTION_STRING: "Server=127.0.0.1;Port=${{ job.services.mysql.ports[3306] }};Database=map_db_test;User=evnexus_ci;Password=ci_map_only_password;"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Wait for authenticated Map test database readiness
        env:
          MAP_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          for attempt in {1..30}; do
            if docker exec -e MYSQL_PWD=ci_map_only_password "$MAP_MYSQL_CONTAINER" \
              mysql --protocol=TCP -h 127.0.0.1 -u evnexus_ci map_db_test -N -e 'SELECT 1'; then
              exit 0
            fi
            sleep 2
          done
          echo 'Isolated Map MySQL service did not become ready.' >&2
          exit 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Map Service
        run: dotnet restore MapService/src/EVNexus.MapService/EVNexus.MapService.csproj

      - name: Build Map Service
        run: dotnet build MapService/src/EVNexus.MapService/EVNexus.MapService.csproj --no-restore --configuration Release

      - name: Restore test project
        run: dotnet restore MapService/tests/EVNexus.MapService.Tests/EVNexus.MapService.Tests.csproj

      - name: Build test project
        run: dotnet build MapService/tests/EVNexus.MapService.Tests/EVNexus.MapService.Tests.csproj --no-restore --configuration Release

      - name: Run Map Service tests
        run: dotnet test MapService/tests/EVNexus.MapService.Tests/EVNexus.MapService.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx" --results-directory ./TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-service-test-results
          path: ./TestResults/*.trx

      - name: Build Map Docker image
        run: docker build -t evnexus-map-service:ci MapService/src/EVNexus.MapService
